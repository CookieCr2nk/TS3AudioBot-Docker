# Rights declaration file
# For more information about syntax and structure see here:
# https://github.com/Splamy/TS3AudioBot/wiki/Rights

"+" = [
	# Basic stuff. Scripting (cmd.eval, cmd.xecute, cmd.json.*) stays with the admin rule.
	"cmd.help.*",
	"cmd.pm",
	"cmd.subscribe",
	"cmd.unsubscribe",
	"cmd.kickme.*",
	"cmd.version",
	"cmd.song",
]

# Admin rule
[[rule]]
	# Set your admin Group Ids here, ex: [ 13, 42 ]
	groupid = []
	# And/Or your admin Client Uids here
	useruid = [  ]
	# Calls from inside this container (health check).
	ip = ["127.0.0.1", "::1"]
	# Every web API caller. Compose does not publish port 58913, and only the
	# panel shares the bot network, so this does not depend on a container IP.
	isapi = true

	"+" = "*"

# Playing rights. No groupid and no useruid: the rule matches everyone.
# Add groupid or useruid here to limit playback to those clients.
[[rule]]
	"+" = [
		# Play controls
		"cmd.play",
		"cmd.pause",
		"cmd.stop",
		"cmd.seek",
		"cmd.volume",

		# Playlist management
		"cmd.list.*",
		"cmd.add",
		"cmd.clear",
		"cmd.previous",
		"cmd.next",
		"cmd.random.*",
		"cmd.repeat.*",

		# History features
		"cmd.history.add",
		"cmd.history.from",
		"cmd.history.id",
		"cmd.history.last",
		"cmd.history.play",
		"cmd.history.till",
		"cmd.history.title",
	]

	# Remove this if you want to allow users to save playlist locally
	"-" = [ "cmd.list.save" ]
