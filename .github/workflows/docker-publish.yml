name: Docker Build & Security

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
#  schedule:
#    - cron: '29 8 * * *'
  push:
    branches: [ "main", "develop" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  # Git ref of Splamy/TS3AudioBot compiled into the bot image.
  BOT_REF: develop
  # Fix Node.js 20 deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
      # Required for SARIF upload to GitHub Security
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,format=short

      # On pull requests we build a single-arch image and load it locally so it
      # can be scanned without pushing. On main and develop we build all
      # platforms and push. main is published as :main, develop as :develop.
      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64,linux/arm/v7' }}
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BOT_REF=${{ env.BOT_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.event_name != 'pull_request' }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      # Report CRITICAL vulnerabilities to the build log. Non-blocking: the image
      # is built from a pinned upstream binary and the Debian base, so fixable
      # CRITICALs may not be remediable here. Findings stay visible in the SARIF
      # upload (Security tab) above. Flip continue-on-error to make this a hard gate.
      - name: Report CRITICAL vulnerabilities (non-blocking)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      # Install cosign for image signing. v3.10.1 installs Cosign 2.6.1.
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.10.1
        with:
          cosign-release: v2.6.1

      # GitHub's OIDC endpoint sometimes returns plain text. Cosign 2.6.1
      # parses that body as JSON and stops. Fetch the token here and retry.
      - name: Sign Docker image with cosign
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: true
          IMAGE_REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          case "${DIGEST}" in
            sha256:*) ;;
            *) echo "build did not publish a digest"; exit 1 ;;
          esac
          image="${IMAGE_REF%:*}@${DIGEST}"
          case "${ACTIONS_ID_TOKEN_REQUEST_URL}" in
            *\?*) sep='&' ;;
            *) sep='?' ;;
          esac
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=sigstore"
          body=""
          token_file=""
          cleanup() {
            if [ -n "${body}" ]; then rm -f "${body}"; fi
            if [ -n "${token_file}" ]; then rm -f "${token_file}"; fi
          }
          trap cleanup EXIT
          for attempt in 1 2 3 4 5; do
            cleanup
            body="$(mktemp)"
            token_file="$(mktemp)"
            chmod 600 "${token_file}"
            status="$(curl -sS -o "${body}" -w '%{http_code}' --max-time 20 \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${url}" || true)"
            token=""
            if [ "${status}" = "200" ]; then
              token="$(jq -er .value "${body}" || true)"
            fi
            if [ -n "${token}" ]; then
              echo "::add-mask::${token}"
              printf '%s' "${token}" > "${token_file}"
              if cosign sign --yes --identity-token "${token_file}" "${image}"; then
                exit 0
              fi
              echo "cosign sign attempt ${attempt} failed"
            else
              echo "OIDC token request attempt ${attempt} returned HTTP ${status}"
              if ! grep -q 'eyJ' "${body}"; then
                head -c 160 "${body}" || true
                echo
              fi
            fi
            if [ "${attempt}" -lt 5 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "cosign sign failed after 5 attempts"
          exit 1

      # Generate SBOM using syft
      - name: Generate SBOM (CycloneDX format)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: cyclonedx-json
          output-file: sbom-bot.json

      - name: Upload SBOM as artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-bot
          path: sbom-bot.json
          retention-days: 30

  panel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-panel
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,format=short

      - name: Build panel image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./panel
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=panel
          cache-to: type=gha,scope=panel,mode=max
          provenance: ${{ github.event_name != 'pull_request' }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'sarif'
          output: 'trivy-panel.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-panel.sarif') != ''
        with:
          sarif_file: 'trivy-panel.sarif'
          category: 'trivy-panel'

      - name: Report CRITICAL vulnerabilities (non-blocking)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.10.1
        with:
          cosign-release: v2.6.1

      # Same OIDC retry as the bot job. The panel image is signed by digest.
      - name: Sign panel image with cosign
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: true
          IMAGE_REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          case "${DIGEST}" in
            sha256:*) ;;
            *) echo "build did not publish a digest"; exit 1 ;;
          esac
          image="${IMAGE_REF%:*}@${DIGEST}"
          case "${ACTIONS_ID_TOKEN_REQUEST_URL}" in
            *\?*) sep='&' ;;
            *) sep='?' ;;
          esac
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=sigstore"
          body=""
          token_file=""
          cleanup() {
            if [ -n "${body}" ]; then rm -f "${body}"; fi
            if [ -n "${token_file}" ]; then rm -f "${token_file}"; fi
          }
          trap cleanup EXIT
          for attempt in 1 2 3 4 5; do
            cleanup
            body="$(mktemp)"
            token_file="$(mktemp)"
            chmod 600 "${token_file}"
            status="$(curl -sS -o "${body}" -w '%{http_code}' --max-time 20 \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${url}" || true)"
            token=""
            if [ "${status}" = "200" ]; then
              token="$(jq -er .value "${body}" || true)"
            fi
            if [ -n "${token}" ]; then
              echo "::add-mask::${token}"
              printf '%s' "${token}" > "${token_file}"
              if cosign sign --yes --identity-token "${token_file}" "${image}"; then
                exit 0
              fi
              echo "cosign sign attempt ${attempt} failed"
            else
              echo "OIDC token request attempt ${attempt} returned HTTP ${status}"
              if ! grep -q 'eyJ' "${body}"; then
                head -c 160 "${body}" || true
                echo
              fi
            fi
            if [ "${attempt}" -lt 5 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "cosign sign failed after 5 attempts"
          exit 1

  # Drop old GHCR versions after both images have been published.
  # main, develop, master, and release tags stay. The three newest sha tags
  # stay. Untagged platform manifests of a kept image stay.
  prune:
    needs: [build, panel]
    if: github.event_name != 'pull_request' && needs.build.result == 'success' && needs.panel.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Delete old GHCR image versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          KEEP_SHA: "3"
        run: node .github/scripts/prune-ghcr.mjs
