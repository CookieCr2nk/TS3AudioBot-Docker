services:
  ts3audiobot:
    image: ghcr.io/cookiecr2nk/ts3audiobot-docker:master
    container_name: ts3audiobot
    restart: unless-stopped
    # 58913 is not published. rights.toml treats every API caller as admin,
    # so the port must stay reachable only by containers on the bot network.
    volumes:
      - ./data:/data
    # TS3AudioBot 0.12 is a .NET Core 3.1 single-file binary. It extracts
    # about 68 MiB into /tmp/.net before it listens. A 64 MiB tmpfs fails
    # that write and the process exits.
    tmpfs:
      - /tmp:mode=1777,size=256m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"