# Bot and web panel with a MariaDB that is not part of this stack.
# Start: docker compose -f docker-compose.panel-external-db.yml up -d
# Bot and panel images come from GHCR. IMAGE_TAG selects the tag. The default is main.
#
# Set PANEL_DB_HOST and PANEL_DB_PASSWORD in the repository-root .env.
# The database and user must already exist. The panel creates its tables.
# host.docker.internal reaches a database on the Docker host.

services:
  ts3audiobot:
    image: ghcr.io/cookiecr2nk/ts3audiobot-docker:${IMAGE_TAG:-main}
    pull_policy: always
    container_name: ts3audiobot
    restart: unless-stopped
    # 58913 is not published. rights.toml treats every API caller as admin,
    # so the port must stay reachable only by containers on the bot network.
    volumes:
      - ts3audiobot-data:/data
    # The root filesystem is read-only, so temporary files go on this tmpfs.
    tmpfs:
      - /tmp:mode=1777,size=256m,exec
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - botapi

  panel:
    image: ghcr.io/cookiecr2nk/ts3audiobot-docker-panel:${IMAGE_TAG:-main}
    pull_policy: always
    container_name: ts3panel
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${PANEL_DB_HOST:?Set PANEL_DB_HOST to the external MariaDB host}
      DB_PORT: ${PANEL_DB_PORT:-3306}
      DB_USER: ${PANEL_DB_USER:-ts3panel}
      DB_PASSWORD: ${PANEL_DB_PASSWORD:?Set PANEL_DB_PASSWORD}
      DB_NAME: ${PANEL_DB_NAME:-ts3panel}
      TOKEN_KEY: ${PANEL_TOKEN_KEY:-dev-only-token-key}
      ADMIN_USER: ${PANEL_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${PANEL_ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${PANEL_COOKIE_SECURE:-false}
      TRUST_PROXY: ${PANEL_TRUST_PROXY:-0}
      PORT: "8080"
    ports:
      - "${PANEL_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - botapi
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ts3audiobot-data:
    name: ts3audiobot-data

networks:
  botapi:
